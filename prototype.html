<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Picker</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e8eb; margin: 0; padding: 16px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: #9aa3ad; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2f38; background: #171a21; color: #e6e8eb; font-size: 15px; }
  select:disabled { opacity: 0.4; }
  button { margin-top: 20px; background: #2f6fed; border-color: #2f6fed; font-weight: 600; }
  button:disabled { background: #2a2f38; border-color: #2a2f38; color: #6b7280; }
  .status { font-size: 13px; color: #9aa3ad; margin-top: 12px; }
  .error { color: #f87171; }
  .summary { margin-top: 20px; padding: 12px; border-radius: 8px; background: #171a21; font-size: 13px; max-height: 400px; overflow: auto; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #2a2f38; font-size: 11px; margin-right: 4px; }
  code { background: #2a2f38; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .debug { margin-top: 20px; font-size: 12px; color: #6b7280; }
  .debug pre { background: #171a21; padding: 8px; border-radius: 6px; max-height: 200px; overflow: auto; font-size: 11px; }
</style>
</head>
<body>

<h1>Curriculum Picker</h1>

<label>Country</label>
<select id="country" disabled><option>Loading…</option></select>

<label>Curriculum</label>
<select id="curriculum" disabled></select>

<label>Subject</label>
<select id="subject" disabled></select>

<label id="levelLabel" style="display:none">Level</label>
<select id="level" style="display:none" disabled></select>

<label>Class</label>
<select id="classLevel" disabled></select>

<button id="load" disabled>Load syllabus</button>

<div class="status" id="status"></div>
<div class="summary" id="summary" style="display:none"></div>

<details class="debug">
  <summary style="cursor:pointer">Debug — parsed files</summary>
  <pre id="debug"></pre>
</details>

<script>
const BASE = "https://cbcaiug.cbcaitool.workers.dev";
const $ = id => document.getElementById(id);

let allFiles = [];

function parsePath(path) {
  const parts = path.split("/");
  const file = parts[parts.length - 1];
  const name = file.replace(/\.json$/, "");
  const classVal = name.split("_")[0];
  return {
    country: parts[0],
    curriculum: parts[1],
    subject: parts[2],
    level: parts.length === 5 ? parts[3] : null,
    classVal: classVal,
    file: file,
    path: path,
  };
}

async function init() {
  try {
    const res = await fetch(`${BASE}/_manifest.json`);
    const manifest = await res.json();
    allFiles = manifest.files
      .filter(f =>
        f.type === "json" &&
        f.path !== "_manifest.json" &&
        !f.path.endsWith("/manifest.json")
      )
      .map(f => ({ ...parsePath(f.path), size: f.size_bytes }));

    $("debug").textContent = JSON.stringify(allFiles.slice(0, 8), null, 2);

    populateCountries();
    setStatus(`Manifest loaded — ${allFiles.length} syllabus files`);
  } catch (err) {
    setStatus(`Failed: ${err.message}`, true);
  }
}

function unique(arr) { return [...new Set(arr)].sort(); }

function fill(select, options) {
  select.innerHTML = "";
  for (const opt of options) {
    const o = document.createElement("option");
    o.value = opt;
    o.textContent = opt;
    select.appendChild(o);
  }
}

function populateCountries() {
  fill($("country"), unique(allFiles.map(f => f.country)));
  $("country").disabled = false;
  $("country").onchange = populateCurricula;
  populateCurricula();
}

function populateCurricula() {
  const c = $("country").value;
  fill($("curriculum"), unique(allFiles.filter(f => f.country === c).map(f => f.curriculum)));
  $("curriculum").disabled = false;
  $("curriculum").onchange = populateSubjects;
  populateSubjects();
}

function populateSubjects() {
  const c = $("country").value, cur = $("curriculum").value;
  fill($("subject"), unique(allFiles.filter(f => f.country === c && f.curriculum === cur).map(f => f.subject)));
  $("subject").disabled = false;
  $("subject").onchange = populateLevels;
  populateLevels();
}

function populateLevels() {
  const c = $("country").value, cur = $("curriculum").value, sub = $("subject").value;
  const pool = allFiles.filter(f => f.country === c && f.curriculum === cur && f.subject === sub);
  const levels = unique(pool.filter(f => f.level).map(f => f.level));

  if (levels.length > 0) {
    $("levelLabel").style.display = "";
    $("level").style.display = "";
    fill($("level"), levels);
    $("level").disabled = false;
    $("level").onchange = populateClasses;
    populateClasses();
  } else {
    $("levelLabel").style.display = "none";
    $("level").style.display = "none";
    $("level").disabled = true;
    populateClasses();
  }
}

function populateClasses() {
  const c = $("country").value, cur = $("curriculum").value, sub = $("subject").value;
  const lvl = $("level").style.display !== "none" ? $("level").value : null;
  const pool = allFiles.filter(f =>
    f.country === c && f.curriculum === cur && f.subject === sub && (lvl ? f.level === lvl : true)
  );
  fill($("classLevel"), unique(pool.map(f => f.classVal)));
  $("classLevel").disabled = false;
  $("classLevel").onchange = () => { $("load").disabled = false; };
  $("load").disabled = false;
  $("summary").style.display = "none";
}

async function loadSyllabus() {
  const c = $("country").value, cur = $("curriculum").value, sub = $("subject").value;
  const cls = $("classLevel").value;
  const lvl = $("level").style.display !== "none" ? $("level").value : null;
  const match = allFiles.find(f =>
    f.country === c && f.curriculum === cur && f.subject === sub && f.classVal === cls && (lvl ? f.level === lvl : true)
  );
  if (!match) { setStatus("No matching file found", true); return; }

  setStatus(`Fetching ${match.path} (${(match.size/1024).toFixed(1)} KB)…`);
  try {
    const res = await fetch(`${BASE}/curriculum/${match.path}`);
    const data = await res.json();
    showSummary(match, data);
    setStatus(`Loaded ${match.path}`);
  } catch (err) {
    setStatus(`Failed: ${err.message}`, true);
  }
}

function showSummary(file, data) {
  const arrays = countArrays(data);
  const el = $("summary");
  el.style.display = "block";
  el.innerHTML = `
    <div><strong>${file.path}</strong></div>
    <div style="margin-top:8px">
      <span class="badge">${(file.size/1024).toFixed(1)} KB</span>
      <span class="badge">${Object.keys(data).length} top-level keys</span>
    </div>
    <div style="margin-top:12px"><strong>Top-level keys:</strong></div>
    <div>${Object.keys(data).map(k => `<code>${k}</code>`).join(" ")}</div>
    <div style="margin-top:12px"><strong>Arrays found:</strong></div>
    <div>${arrays.map(a => `<div>${a.path} → ${a.length} items</div>`).join("") || "<em>none</em>"}</div>
    <details style="margin-top:12px">
      <summary style="cursor:pointer">Raw preview</summary>
      <pre style="max-height:300px; overflow:auto; font-size:11px;">${JSON.stringify(data, null, 2).slice(0, 3000)}…</pre>
    </details>
  `;
}

function countArrays(obj, base = "", depth = 0) {
  if (depth > 3 || !obj || typeof obj !== "object") return [];
  const found = [];
  if (Array.isArray(obj)) {
    found.push({ path: base || "(root)", length: obj.length });
    return found;
  }
  for (const [k, v] of Object.entries(obj)) {
    const path = base ? `${base}.${k}` : k;
    if (Array.isArray(v)) found.push({ path, length: v.length });
    else if (v && typeof v === "object") found.push(...countArrays(v, path, depth + 1));
  }
  return found;
}

function setStatus(msg, isError = false) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isError ? " error" : "");
}

$("load").onclick = loadSyllabus;
init();
</script>
</body>
</html>
